<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gesture Meme Detector — Debug</title>
<style>
  :root {
    --bg: #14151a;
    --panel: #1c1e26;
    --line: #2c2f3a;
    --text: #e8e8ec;
    --dim: #8b8d98;
    --accent: #7ee787;
    --warn: #f2c94c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--dim);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
  }

  .pane {
    background: var(--panel);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 60vh;
  }

  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  video { transform: scaleX(-1); }
  #overlay { transform: scaleX(-1); }

  #debugPane {
    background: #000;
    justify-content: center;
    align-items: center;
  }

  #matchImg {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 120ms ease;
  }

  #matchImg.show { opacity: 1; }

  #status {
    padding: 10px 20px;
    font-size: 12px;
    color: var(--warn);
    border-top: 1px solid var(--line);
  }

  #status.ok { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>gesture-meme-detector — debug view</h1>
  <p>left: camera + landmark overlay · right: live tracking values (memes come next)</p>
</header>

  <div class="pane" id="cameraPane">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="pane" id="debugPane">
    <img id="matchImg" src="" alt="" />
  </div>
</main>

  let activeMatchName = null;
  let activeMatchImage = null;
  let pendingName = null;
  let pendingCount = 0;
  const CONFIRM_TICKS = 2; // require this many consistent detections before switching

  function showMatch(name, images) {
    if (name !== activeMatchName) {
      activeMatchName = name;
      activeMatchImage = images[Math.floor(Math.random() * images.length)];
      matchImg.src = activeMatchImage;
      matchImg.alt = name;
    }
    matchImg.classList.add("show");
  }

  function clearMatch() {
    activeMatchName = null;
    activeMatchImage = null;
    matchImg.classList.remove("show");
  }

  // Debounces raw per-frame matches so a flicker of misdetection doesn't
  // instantly swap the image — the same result has to repeat a couple times.
  function resolveMatch(rawName, rawImages) {
    if (rawName === pendingName) {
      pendingCount++;
    } else {
      pendingName = rawName;
      pendingCount = 1;
    }
    if (pendingCount >= CONFIRM_TICKS) {
      if (rawName) showMatch(rawName, rawImages);
      else clearMatch();
    }
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  // Thumb tip + index tip pinched close together (the "finger heart" pose),
  // scaled against hand size so it works at any distance from the camera.
  function isFingerHeart(hand) {
    const handScale = dist(hand[0], hand[9]); // wrist to middle-finger MCP
    const pinch = dist(hand[4], hand[8]) / handScale;
    return pinch < 0.35;
  }

  // Rough open/curled classification per hand using tip-to-wrist vs
  // knuckle-to-wrist distances across the four non-thumb fingers.
  function classifyHandShape(hand) {
    const wrist = hand[0];
    const fingers = [
      [8, 5], [12, 9], [16, 13], [20, 17], // [tip, mcp] for index/middle/ring/pinky
    ];
    let curled = 0;
    let extended = 0;
    for (const [tipIdx, mcpIdx] of fingers) {
      const tipDist = dist(hand[tipIdx], wrist);
      const mcpDist = dist(hand[mcpIdx], wrist);
      if (tipDist < mcpDist * 1.15) curled++;
      else if (tipDist > mcpDist * 1.8) extended++;
    }
    if (curled >= 3) return "fist";
    if (extended >= 3) return "open";
    return "other";
  }

  function faceBoundingBox(face) {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (const pt of face) {
      if (pt.x < minX) minX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y > maxY) maxY = pt.y;
    }
    return { minX, minY, maxX, maxY };
  }

  function handNearFace(hand, box) {
    const marginX = (box.maxX - box.minX) * 0.4;
    const marginY = (box.maxY - box.minY) * 0.4;
    let cx = 0, cy = 0;
    for (const pt of hand) { cx += pt.x; cy += pt.y; }
    cx /= hand.length;
    cy /= hand.length;
    return (
      cx > box.minX - marginX &&
      cx < box.maxX + marginX &&
      cy > box.minY - marginY &&
      cy < box.maxY + marginY
    );
  }

  let handLandmarker, faceLandmarker;

  async function setup() {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numHands: 1,
    });

    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: true,
    });

    await startCamera();
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false,
      });
      video.srcObject = stream;
      await new Promise((res) => (video.onloadedmetadata = res));
      video.play();
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      statusEl.textContent = "tracking live — move your hands / face around";
      statusEl.classList.add("ok");
      requestAnimationFrame(loop);
    } catch (err) {
      statusEl.textContent =
        "camera error: " + err.message + " (check permissions, and that you're on http://localhost or https://)";
    }
  }

  function blend(shapes, name) {
    const b = shapes?.[0]?.categories?.find((c) => c.categoryName === name);
    return b ? b.score : 0;
  }

  // Detection is capped well below display refresh rate — this is the main
  // lag fix. We still redraw every animation frame using the last cached
  // result, so the overlay looks smooth even though detection itself runs
  // at ~12/sec instead of 60/sec.
  const DETECT_INTERVAL_MS = 80;
  let lastDetectTime = 0;
  let cachedHandResult = { landmarks: [] };
  let cachedFaceResult = { faceLandmarks: [], faceBlendshapes: [] };

  function loop() {
    const now = performance.now();

    if (now - lastDetectTime >= DETECT_INTERVAL_MS) {
      lastDetectTime = now;
      cachedHandResult = handLandmarker.detectForVideo(video, now);
      cachedFaceResult = faceLandmarker.detectForVideo(video, now);

      const hasFace = cachedFaceResult.faceLandmarks.length > 0;
      let faceBox = hasFace ? faceBoundingBox(cachedFaceResult.faceLandmarks[0]) : null;

      // --- Priority 1: hand gestures ---
      let handMatch = null;
      for (const hand of cachedHandResult.landmarks) {
        if (faceBox && handNearFace(hand, faceBox)) {
          handMatch = HAND_RULES.facepalm;
          break;
        }
        if (isFingerHeart(hand)) {
          handMatch = HAND_RULES.heart;
          break;
        }
        const shape = classifyHandShape(hand);
        if (shape === "fist") {
          handMatch = HAND_RULES.fist;
          break;
        }
        if (shape === "open") {
          handMatch = HAND_RULES.wave;
          break;
        }
      }

      if (handMatch) {
        resolveMatch(handMatch.name, handMatch.images);
      } else if (hasFace) {
        // --- Priority 2: face expression rules ---
        const shapes = cachedFaceResult.faceBlendshapes;
        const faceMatch = FACE_RULES.find((rule) => rule.test(shapes));
        resolveMatch(faceMatch ? faceMatch.name : null, faceMatch ? faceMatch.images : null);
      } else {
        resolveMatch(null, null);
      }
    }

    // Draw every frame using whatever the latest cached detection was.
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    ctx.fillStyle = "#7ee787";
    for (const hand of cachedHandResult.landmarks) {
      for (const pt of hand) {
        ctx.beginPath();
        ctx.arc(pt.x * overlay.width, pt.y * overlay.height, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (cachedFaceResult.faceLandmarks.length) {
      ctx.fillStyle = "#f2c94c";
      const face = cachedFaceResult.faceLandmarks[0];
      for (let i = 0; i < face.length; i += 5) {
        const pt = face[i];
        ctx.beginPath();
        ctx.arc(pt.x * overlay.width, pt.y * overlay.height, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(loop);
  }

  setup();
</script>

</body>
</html>
